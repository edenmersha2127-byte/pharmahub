server:
  port: 8089

spring:
  application:
    name: sales-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:medicine_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:medicine_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Downstream services (overridden by env in docker-compose)
inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Shared REST client timeout (seconds)
rest-client:
  timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
