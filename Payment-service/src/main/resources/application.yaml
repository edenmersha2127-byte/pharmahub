server:
  port: 8088

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Downstream services
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}
notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

rest-client:
  timeout-seconds: 15

# Chapa payment gateway (https://developer.chapa.co)
chapa:
  base-url: ${CHAPA_BASE_URL:https://api.chapa.co}
  secret-key: ${CHAPA_SECRET_KEY:}
  webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
  # Where Chapa redirects the pharmacy after paying, and where it calls us back.
  callback-url: ${CHAPA_CALLBACK_URL:http://localhost:8088/api/payments/webhook}
  return-url: ${CHAPA_RETURN_URL:http://localhost:5173/pharmacy/subscription}
  currency: ETB

# Subscription plans and trial. Prices in ETB.
subscription:
  trial-days: ${SUBSCRIPTION_TRIAL_DAYS:15}
  plans:
    monthly:
      price: ${PLAN_MONTHLY_PRICE:1000}
      duration-days: 30
    yearly:
      price: ${PLAN_YEARLY_PRICE:12000}
      duration-days: 365
  # Reminder this many days before expiry.
  reminder-days-before: ${SUBSCRIPTION_REMINDER_DAYS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.medicinelocator.paymentservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
