# ==========================================================================
# MediLocator — full stack: infra (postgres, redis) + 8 microservices.
# Usage:
#   1. cp .env.example .env   (then fill in real secrets)
#   2. docker compose up -d --build
#   3. docker compose ps      (watch health)
#   4. docker compose logs -f gateway
# Everything is reachable through the gateway at http://localhost:8080
# ==========================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: medicine-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # This DB is just the default; per-service DBs are created by the init script.
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs ONLY on first startup (empty volume). See docker/init-databases.sql.
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medicine-net

  redis:
    image: redis:7-alpine
    container_name: medicine-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medicine-net

  # ---------------------------------------------------------------- auth :8081
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: medicine-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auths_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ----------------------------------------------------------- search :8083
  search-service:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: medicine-search-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/search_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # -------------------------------------------------------- inventory :8082
  inventory-service:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: medicine-inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      SEARCH_SERVICE_URL: http://search-service:8083
      SEARCH_SERVICE_TIMEOUT_SECONDS: 5
      REST_CLIENT_TIMEOUT_SECONDS: 10
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ---------------------------------------------------- prescription :8084
  prescription-service:
    build:
      context: ./prescription
      dockerfile: Dockerfile
    container_name: medicine-prescription-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prescription_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini_vision}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_ENDPOINT: ${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/models}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      SEARCH_SERVICE_URL: http://search-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      search-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # -------------------------------------------------- notification :8086
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: medicine-notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ------------------------------------------------------- report :8091
  report-service:
    build:
      context: ./Report-service
      dockerfile: Dockerfile
    container_name: medicine-report-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/report_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ------------------------------------------------------ payment :8088
  payment-service:
    build:
      context: ./Payment-service
      dockerfile: Dockerfile
    container_name: medicine-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET}
      CHAPA_BASE_URL: ${CHAPA_BASE_URL:-https://api.chapa.co}
      CHAPA_CALLBACK_URL: ${CHAPA_CALLBACK_URL}
      CHAPA_RETURN_URL: ${CHAPA_RETURN_URL}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ------------------------------------------------------- sales :8089
  sales-service:
    build:
      context: ./sales-service
      dockerfile: Dockerfile
    container_name: medicine-sales-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sales_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medicine-net

  # ----------------------------------------------------- gateway :8080
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: medicine-api-gateway
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SEARCH_SERVICE_URL: http://search-service:8083
      PRESCRIPTION_SERVICE_URL: http://prescription-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      REPORT_SERVICE_URL: http://report-service:8091
      PAYMENT_SERVICE_URL: http://payment-service:8088
      SALES_SERVICE_URL: http://sales-service:8089
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - medicine-net

volumes:
  postgres_data:
  redis_data:

networks:
  medicine-net:
    driver: bridge
