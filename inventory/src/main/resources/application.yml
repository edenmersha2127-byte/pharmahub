# ===================================================================
# LOCAL TESTING SETTINGS (ACTIVE)
# ===================================================================

server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update   # changed from validate → update for local development
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

# Auth Service — local instance
auth-service:
  url: http://localhost:8081

# Search Service — local instance
search-service:
  url: http://localhost:8083
  index-path: /index/medicine
  timeout-seconds: 5

# Notification Service — local instance
notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

# Shared REST client timeout
rest-client:
  timeout-seconds: 10

inventory:
  # Stock at or below this level triggers a LOW_STOCK notification.
  low-stock-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:10}
  # Batches expiring within this many days are flagged by the daily expiry scan.
  expiry-warning-days: ${INVENTORY_EXPIRY_WARNING_DAYS:30}
  # Cron for the expiry scan (default: every day at 06:00).
  expiry-scan-cron: ${INVENTORY_EXPIRY_SCAN_CRON:0 0 6 * * *}
  # Cron for the daily inventory snapshot used by /stats/trends (default: 00:30 daily).
  snapshot-cron: ${INVENTORY_SNAPSHOT_CRON:0 30 0 * * *}
  cache:
    pharmacy-medicines-ttl-seconds: 120
    search-ttl-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

  health:
    redis:
      enabled: false
    reactive:
      redis:
        enabled: false

logging:
  level:
    com.medicinelocator.inventory: DEBUG
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"