server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Downstream service used only to resolve the recipients of the
# nightly "update your medicines" reminder.
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

rest-client:
  timeout-seconds: 10

# Nightly reminder that asks every approved pharmacy to update its medicines.
# Default: 19:00 (7 PM) every day, Addis Ababa time. Override via env if needed.
notification:
  medicine-reminder:
    enabled: true
    cron: ${MEDICINE_REMINDER_CRON:0 0 19 * * *}
    zone: ${MEDICINE_REMINDER_ZONE:Africa/Addis_Ababa}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.medicinelocator.notificationservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
